<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>GUI TASK</title>
<style>
  html,body{margin:0;padding:0;background:#ffffff;font-family:monospace;}
  #stage{position:relative;width:1024px;height:768px;overflow:hidden;}
  .btn{position:absolute;width:210px;height:86px;background:#ffffff;color:#000000;
       border:4px solid #000000;font-size:34px;font-weight:bold;line-height:78px;
       text-align:center;cursor:pointer;box-sizing:border-box;}
  #hdr{position:absolute;left:0;top:0;width:1024px;height:60px;font-size:26px;
       line-height:60px;text-align:center;background:#ffffff;border-bottom:3px solid #000;}
  #modal{position:absolute;left:0;top:0;width:1024px;height:768px;display:none;
         background:rgba(255,255,255,0.97);z-index:99;}
  #modalbtn{position:absolute;left:412px;top:340px;width:200px;height:86px;background:#fff;
            color:#000;border:4px solid #000;font-size:34px;font-weight:bold;line-height:78px;
            text-align:center;}
</style></head>
<body>
<div id="stage">
  <div id="hdr">STEP 1 / 4 &nbsp;&nbsp; TARGET: BETA</div>
  <div id="modal"><div id="modalbtn">CLOSE</div></div>
</div>
<script>
const P = new URLSearchParams(location.search);
const SHUFFLE = P.get('shuffle') === '1';
const MODALP  = parseFloat(P.get('modal') || '0');
const SEED    = parseInt(P.get('seed') || '1');
const WORDS   = ['ALPHA','BETA','GAMMA','DELTA'];
const TARGETS = ['BETA','DELTA','ALPHA','GAMMA'];
const SLOTS = [[60,120],[280,120],[500,120],[720,120],
               [60,240],[280,240],[500,240],[720,240],
               [60,360],[280,360],[500,360],[720,360],
               [60,480],[280,480],[500,480],[720,480]];
function rng(s){ let x = Math.sin(s)*10000; return x - Math.floor(x); }
function perm(n, s){ const a=[...Array(n).keys()]; for(let i=n-1;i>0;i--){const j=Math.floor(rng(s+i*7.3)* (i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
let step = 0, errors = 0, modalOpen = false;
window.__ev = [];
document.addEventListener('mousedown', e=>{window.__ev.push({t:'mousedown',x:e.clientX,y:e.clientY,tg:(e.target.textContent||'').trim(),ts:Date.now()})}, true);
document.addEventListener('mouseup',   e=>{window.__ev.push({t:'mouseup',  x:e.clientX,y:e.clientY,tg:(e.target.textContent||'').trim(),ts:Date.now()})}, true);
document.addEventListener('click',     e=>{window.__ev.push({t:'click',    x:e.clientX,y:e.clientY,tg:(e.target.textContent||'').trim(),ts:Date.now()})}, true);
function layout(){
  document.querySelectorAll('.btn').forEach(b=>b.remove());
  const slotSeed = SHUFFLE ? (SEED*31 + step*97) : SEED*31;
  const p = perm(SLOTS.length, slotSeed);
  WORDS.forEach((w,i)=>{
    const s = SLOTS[p[i]];
    const d = document.createElement('div');
    d.className='btn'; d.textContent=w;
    d.style.left=s[0]+'px'; d.style.top=s[1]+'px';
    d.dataset.word=w;
    d.addEventListener('click', ()=>hit(w));
    document.getElementById('stage').appendChild(d);
  });
  document.getElementById('hdr').textContent =
     'STEP '+(step+1)+' / 4   TARGET: '+TARGETS[step];
}
function hit(w){
  if(modalOpen) return;
  if(w === TARGETS[step]){
    step++;
    if(step>=4){ document.getElementById('hdr').textContent='DONE CODE '+SEED; return; }
    if(MODALP>0 && rng(SEED*13+step*57) < MODALP){ openModal(); }
    layout();
  } else { errors++; }
}
function openModal(){ modalOpen=true; document.getElementById('modal').style.display='block'; }
document.getElementById('modalbtn').addEventListener('click', ()=>{
  modalOpen=false; document.getElementById('modal').style.display='none';
});
layout();
window.__state = ()=>({step:step, errors:errors, modal:modalOpen, done:step>=4, target:TARGETS[step]||null});
window.__events = ()=>window.__ev;
</script></body></html>
