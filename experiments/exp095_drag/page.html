<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#fff;overflow:hidden}
canvas{display:block}
</style></head><body>
<canvas id="c" width="1000" height="300"></canvas>
<script>
const P = new URLSearchParams(location.search);
const MODE = P.get('mode') || 'honest';
const GAIN = parseFloat(P.get('gain')||'1.0');
const c=document.getElementById('c'), x=c.getContext('2d');
let hx=80;                 // handle A
let tx=700;                // target B
let dragging=false, lastX=null;
function draw(){
  x.fillStyle='#fff'; x.fillRect(0,0,1000,300);
  x.fillStyle='#222'; x.fillRect(100,140,800,10);      // track
  x.fillStyle='rgb(40,200,40)'; x.fillRect(tx-8,205,16,50); // target 绿
  x.fillStyle='rgb(220,40,40)'; x.fillRect(hx-10,150,20,50); // handle 红
  x.fillStyle='#000'; x.font='28px sans-serif';
  x.fillText('H='+Math.round(hx)+'  T='+Math.round(tx),20,50);
}
draw();
c.addEventListener('mousedown',e=>{dragging=true;});
window.addEventListener('mouseup',()=>{dragging=false;});
window.addEventListener('mousemove',e=>{
  if(!dragging) return;
  const cx = e.clientX; 
  if(lastX===null){ lastX=cx; return; }
  const dx = cx - lastX; lastX = cx;
  hx=Math.max(60,Math.min(940,hx+dx*GAIN));
  if(MODE==='drift'){ tx=Math.max(120,Math.min(880,tx + (Math.random()*2-1)*8)); }
  draw();
});
</script></body></html>
