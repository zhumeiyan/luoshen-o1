<!doctype html><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:#000}
canvas{display:block}</style>
<canvas id=c width=640 height=360></canvas>
<script>
const c=document.getElementById('c'), g=c.getContext('2d');
const TILE=360, NW=8, ZHOU=594;
let off=0; let im=new Image();
im.src="片_底.png";
im.onload=()=>{ draw(); window.__ready=1; };
function draw(){
  g.fillStyle="#0a0a0a"; g.fillRect(0,0,640,340);
  // 内容：平铺的图，按累计位移平移
  const x0=-(((off%TILE)+TILE)%TILE);
  for(let i=0;i<NW;i++) g.drawImage(im, x0+i*TILE, 0, TILE, 340);
  // 底部：真值就画在这儿，跟内容同一次渲染产生
  g.fillStyle="#000"; g.fillRect(0,340,640,20);
  g.fillStyle="#fff"; g.fillRect(off%ZHOU, 344, 5, 14);
}
window.__go=(px)=>{ off+=px; draw(); return off; };
window.__off=()=>off;
</script>
