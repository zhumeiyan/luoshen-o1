<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#111;overflow:hidden}
#w{position:fixed;left:0;top:0;width:2400px;height:520px}
img{height:520px}</style>
<div id=w><img src="野败_底图.png"><img src="野败_底图.png" style="margin-left:30px"><img src="野败_底图.png" style="margin-left:30px"></div>
<script>
const V=84;
const W=document.getElementById('w'); const t0=performance.now();
window.__now=function(){return performance.now()-t0;};
window.__off=function(){const m=W.style.transform.match(/translateX\((-?[\d.]+)px\)/); return m?parseFloat(m[1]):0;};
function loop(){const t=(performance.now()-t0)/1000; W.style.transform='translateX('+(-(V*t)%560)+'px)'; requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
