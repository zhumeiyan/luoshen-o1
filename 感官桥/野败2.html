<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#111;overflow:hidden}
#w{position:fixed;left:0;top:0;height:520px;white-space:nowrap}
img{height:520px;margin-right:8px}</style>
<div id=w><img src="野败2_底图.png"><img src="野败2_底图.png"><img src="野败2_底图.png"><img src="野败2_底图.png"><img src="野败2_底图.png"><img src="野败2_底图.png"></div>
<script>
const V=104;
const W=document.getElementById('w'); const t0=performance.now();
const TL=[];  // 页面自己记的时间线：每一帧它自己的时刻和累计位移
window.__now=function(){return performance.now()-t0;};
window.__tl=function(){return JSON.stringify(TL);};
function loop(){
  const t=performance.now()-t0;
  const off=V*t/1000;              // 未取模的累计位移，真值没有绕回歧义
  W.style.transform='translateX('+(-off)+'px)';
  TL.push([t,off]);
  if(TL.length<100000) requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
