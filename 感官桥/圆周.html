<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#04121f;overflow:hidden}</style>
<canvas id=c width=900 height=500></canvas>
<script>
const c=document.getElementById('c'), g=c.getContext('2d');
const R=170, CX=450, CY=250;
function drawAt(t){
  g.fillStyle='#04121f'; g.fillRect(0,0,900,500);
  for(let i=0;i<40;i++){
    const x=(i*47+Math.sin(t*0.9+i)*22)%900, y=40+((i*71+Math.cos(t*0.6+i)*18)%420);
    g.fillStyle='rgba(90,180,230,'+(0.05+0.04*Math.sin(t*1.3+i))+')';
    g.beginPath(); g.arc(x,y,20+8*Math.sin(t+i),0,6.3); g.fill();
  }
  const a=t*1.30, sx=CX+R*Math.cos(a), sy=CY+R*Math.sin(a);
  const gr=g.createRadialGradient(sx,sy,2,sx,sy,46);
  gr.addColorStop(0,'rgba(255,245,210,1)'); gr.addColorStop(1,'rgba(255,220,150,0)');
  g.fillStyle=gr; g.beginPath(); g.arc(sx,sy,46,0,6.3); g.fill();
}
window.__set=function(t){ drawAt(t); return 't='+t; };
drawAt(0);
</script>
