<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#06131f;overflow:hidden}</style>
<canvas id=c width=900 height=520></canvas>
<script>
const g=document.getElementById('c').getContext('2d');
function drawAt(t){
  g.fillStyle='#06131f'; g.fillRect(0,0,900,520);
  // 起伏的山脊，随 t 整体横移，速度 90 px/s
  const v=90, off=v*t;
  for(let L=0;L<3;L++){
    const base=140+L*130, col=['rgba(40,110,150,0.95)','rgba(60,150,190,0.9)','rgba(90,190,225,0.85)'][L];
    g.beginPath(); g.moveTo(0,520);
    for(let x=0;x<=900;x+=3){
      const a=(x+off)-L*40;
      const y=base + 52*Math.sin(a/58) + 24*Math.sin(a/25+0.9) + 10*Math.sin(a/11+2.1);
      g.lineTo(x,y);
    }
    g.lineTo(900,520); g.closePath(); g.fillStyle=col; g.fill();
  }
  // 水面反光斑：也随时间动
  for(let i=0;i<26;i++){
    const x=((i*137 + t*120)%940)-20, y=70+((i*83)%90);
    const r=14+7*Math.sin(t+i);
    const gr=g.createRadialGradient(x,y,1,x,y,r*2.2);
    gr.addColorStop(0,'rgba(210,245,255,0.55)'); gr.addColorStop(1,'rgba(210,245,255,0)');
    g.fillStyle=gr; g.beginPath(); g.arc(x,y,r*2.2,0,6.3); g.fill();
  }
}
window.__set=function(t){drawAt(t);return t;};
drawAt(0);
</script>
