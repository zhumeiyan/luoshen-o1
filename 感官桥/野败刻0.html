<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#111;overflow:hidden}
#w{position:fixed;left:0;top:0;height:460px;white-space:nowrap}
img{height:460px;margin-right:8px}
#bar{position:fixed;left:0;top:460px;width:1200px;height:60px;background:#000}
#tick{position:absolute;top:0;width:3px;height:60px;background:#fff}</style>
<div id=w><img src="野败0_底图.png"><img src="野败0_底图.png"><img src="野败0_底图.png"><img src="野败0_底图.png"><img src="野败0_底图.png"><img src="野败0_底图.png"></div><div id=bar><div id=tick></div></div>
<script>
const V=118;
const W=document.getElementById('w'),TK=document.getElementById('tick');
const t0=performance.now();
function loop(){
  const t=(performance.now()-t0)/1000;
  const off=V*t;
  W.style.transform='translateX('+(-off)+'px)';
  TK.style.left=off+'px';      // 真值就画在这一帧上，跟像素同一次渲染产生
  if(off<1180) requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
