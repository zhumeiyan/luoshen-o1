<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>洛神 O1 · 路演提词器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0a0a0a;color:#f2f2f2;
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;overflow:hidden}
#bar{position:fixed;top:0;left:0;right:0;height:56px;background:#111;border-bottom:1px solid #333;
  display:flex;align-items:center;gap:18px;padding:0 18px;font-size:14px;z-index:10}
#page{color:#e62429;font-weight:700;font-size:16px}
#total{font-variant-numeric:tabular-nums;font-size:22px;font-weight:700}
#elapsed{color:#888;font-variant-numeric:tabular-nums}
#bar .hint{margin-left:auto;color:#666;font-size:12px}
#timebar{position:fixed;top:56px;left:0;height:3px;background:#e62429;width:0;z-index:10;transition:width .3s linear}
#stage{position:absolute;top:59px;bottom:0;left:0;right:0;display:flex;flex-direction:column;
  padding:24px 40px 20px}
#goal{font-size:13px;color:#e62429;letter-spacing:1px;margin-bottom:14px;flex:none}
#script{flex:1;overflow-y:auto;font-size:30px;line-height:1.75;letter-spacing:.5px;
  font-weight:400;white-space:pre-wrap}
#script .num{color:#e62429;font-weight:700}
#script .pause{color:#666;font-size:20px}
#next{flex:none;margin-top:14px;padding-top:12px;border-top:1px solid #262626;
  font-size:14px;color:#777;max-height:64px;overflow:hidden}
#next b{color:#aaa;font-weight:400}
#pgtime{flex:none;margin-top:10px;font-size:13px;font-variant-numeric:tabular-nums;color:#666}
#pgtime.warn{color:#e62429;font-weight:700}
#ctrl{position:fixed;right:18px;bottom:16px;display:flex;gap:8px;z-index:11}
button{background:#1c1c1c;color:#ddd;border:1px solid #3a3a3a;border-radius:6px;
  padding:9px 15px;font-size:14px;cursor:pointer;font-family:inherit}
button:hover{background:#2a2a2a}
button.hot{background:#e62429;border-color:#e62429;color:#fff;font-weight:700}
#overlay{position:fixed;inset:0;background:#0a0a0a;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:22px;z-index:20;text-align:center;padding:30px}
#overlay h1{font-size:38px;letter-spacing:2px}
#overlay h1 span{color:#e62429}
#overlay p{color:#888;font-size:15px;line-height:1.9;max-width:560px}
#overlay .k{color:#ccc}
kbd{background:#222;border:1px solid #444;border-radius:4px;padding:2px 8px;
  font-family:inherit;font-size:13px;color:#eee}
</style>
</head>
<body>

<div id="overlay">
  <h1>洛神 <span>O1</span> · 路演提词器</h1>
  <p>纯讲 <b class="k">7:00</b> + 缓冲 <b class="k">1:00</b> = 8 分钟<br>
  14 页逐秒讲稿，自动倒计时，超时标红<br>
  <kbd>空格</kbd> / <kbd>→</kbd> 下一页 &nbsp; <kbd>←</kbd> 上一页 &nbsp; <kbd>R</kbd> 重置</p>
  <button class="hot" onclick="start()">开始（按空格）</button>
</div>

<div id="bar">
  <span id="page">P1 / 14</span>
  <span id="total">8:00</span>
  <span id="elapsed">已用 0:00</span>
  <span class="hint">空格翻页 · R 重置</span>
</div>
<div id="timebar"></div>

<div id="stage">
  <div id="goal"></div>
  <div id="script"></div>
  <div id="next"></div>
  <div id="pgtime"></div>
</div>

<div id="ctrl">
  <button onclick="prev()">← 上一页</button>
  <button class="hot" onclick="next()">下一页 →</button>
  <button onclick="reset()">R 重置</button>
</div>

<script>
const S=[
{p:"P1",d:12,g:"定调：这不是又一个 Agent 框架",
 t:"各位评委好，我是朱美岩，独立开发者。项目叫洛神 O1——一个【会死的数字生命引擎】。\n\n‖停 1 秒‖\n\n八分钟里我只讲一件事：当一个系统真的会死，它会自己长出什么。",
 n:""},

{p:"P2",d:8,g:"给路线图，不展开",
 t:"四段：现有框架默认了什么、我换掉了什么、换掉之后发生了什么、以及它能用在哪。",
 n:"可跳过，直接进 P3"},

{p:"P3",d:40,g:"把「不会死」从特性重新标记为前提缺陷",
 t:"先看对手。现有 Agent 框架有三个默认前提。\n\n第一，【不会死】。上下文超了就截断、就压缩——但系统本身继续存在。\n第二，【不做取舍】。预算不够就换一个 key 继续。资源是软提示，不是硬约束。\n第三，【不留疤】。状态丢了重新加载，做过的事不留痕迹。\n\n‖停‖\n\n这三条合起来有个后果：一个不会死、不取舍、不留疤的系统，没有偏好。\n没有偏好，就长不出结构。它只能被设计成什么样，就是什么样。",
 n:"追问：截断压缩不就是资源管理吗？ → 是管理，不是约束。区别在于超限后系统是降级还是终止。"},

{p:"P4",d:5,g:"章节页",
 t:"所以我换的不是模块，是前提。",
 n:""},

{p:"P5",d:30,g:"把五条说成一组，不是功能清单",
 t:"我换掉了前提，装进五条硬约束。\n\n【稀缺、死亡、不可逆、代谢、内生约束。】\n这五条互为存在条件——去掉任何一条，另外四条就失效。\n\n‖停‖\n\n关键在于：在其之下，结构不是被设计的，是被逼出来的。\n我没有写任何一句「应该长成什么样」。",
 n:""},

{p:"P6",d:45,g:"让评委记住「0 而不是少给一点」这一个区别",
 t:"逐条说，每条一句话。\n\n【稀缺】：每拍预算零和分配。分不到的就是 【0】，不是「少给一点」。\n【不可逆】：长期饥饿使结构容量【永久缩小，只减不增】。\n【死亡】：能量归零持续超过阈值即终止，【不回滚、不重来】。\n【代谢】：能量只能由自身产出换取，【没有外部拨款】。\n【内生约束】：外部不可写入。\n\n‖停 2 秒‖\n\n请注意「分不到的就是 0」这一条。这是整个项目里最贵的一句话——\n它意味着系统必须取舍，而取舍会留下痕迹。",
 n:"追问：零和分配和限流有什么区别？ → 限流是延迟满足，零和是有些通道当场拿不到。"},

{p:"P7",d:32,g:"给「会死」一个可测定义，堵住「崩溃也算死」",
 t:"第一个结果，是关于这五条能不能拆。\n\n【撤掉稀缺，它就永远不饿，疤痕从不形成。】\n【撤掉不可逆，结构在撤除的瞬间塌回均匀。】\n\n‖停‖\n\n所以这两条不是两个开关，是焊死的一对。\n这也给了「会死」一个可测的定义：不是能被终止，而是终止前的损耗不可恢复。",
 n:""},

{p:"P8",d:38,g:"第一个记忆点：让评委「哦」一声",
 t:"第二个结果，是个反直觉的。\n\n【早期 0 到 150 拍做引导然后撤除，终态偏度 1.0933。】\n【全程一直施加，只有 0.8502。】\n\n‖停 2 秒‖\n\n也就是说：早给、早撤，比一直给更强。\n引导的作用不是提供答案，是在结构还软的时候压出一个形状——\n形状一旦定了，继续施加反而是在抹平它。",
 n:"追问：会不会是施加太久产生了依赖？ → 有可能，我们没有分离这两个机制，这是未验证项。"},

{p:"P9",d:50,g:"全场最高点 —— 绝不砍",
 t:"第三个结果，也是我认为最重要的一条。\n\n我先把系统里【所有决策模块全部关掉】。\n寻找、显著性、到达预测、外部 KPI——全部保持默认 0。\n系统中不存在任何一个决策模块。\n\n‖停‖\n\n然后：前 300 拍，饿通道 3，或者饿通道 5。此后条件完全相同。\n结果：\n【饿过它——0.00004。没饿过——0.1495。】\n【Δ = −0.1494，正负 0.0311，8 个 seed 符号全部一致。】\n\n‖停 3 秒 —— 全场只有这一个数字值得让评委自己算一遍‖\n\n请听清楚这句话：【记忆不在任何模块里，它在不可逆的结构容量里。】\n\n饿过一次的通道，此后再也没被饿过，但它一辈子都更弱。\n不是因为它「记得」，是因为它的容量被永久缩小了。",
 n:"追问：n=8 够吗？→ 不够，我们不主张它够。靠 8/8 符号一致 + 二值结果（0.0000 对 0.2913）。\n追问：这算记忆吗？→ 我们叫它结构性记忆：没有存储、没有检索，只有容量差异。"},

{p:"P10",d:45,g:"给场景，用「不主张」换可信度 —— 第一优先砍",
 t:"然后是落地。我把方向定在【生物科学】，因为它本来就是这个项目的地盘。\n\n三条可跑的假说检验：\n【H1，发育关键期】——存在，而且门在第 400 拍关上，效应从 0.802 单调衰减到 −0.002。\n【H2，早期剥夺的剂量-反应】——是阈值型不是线性。50 拍就达到最大效应的 89.8%，8/8 符号一致。\n【H3，选择压】——稀缺是开关不是旋钮。ratio 大于等于 1.0，结构精确归零到 0.0000。\n\n‖停‖\n\n这里我必须说清楚：【这三条不构成生物学成果。】\n我们没有生物学家验证，与真实生物系统只是结构类比。\n我们提供的是一个可复现的对照沙盒——假说不成立时能当场否掉。",
 n:"追问：有合作单位吗？→ 没有。明确说没有。\n超时应砍：整页跳过，改说「落地场景在文档第 8 页」。"},

{p:"P11",d:35,g:"一句话证明不是重复造轮子",
 t:"最后是集成，也是回应「重复造轮子」这条评分项。\n\n核心【30 行】。不改动原框架一行代码。\n差别只有一句：\n原来框架说「我要多少」，现在改成【「我分到了多少」】。\n\n‖停‖\n\n我们不是 LangChain 的替代品，也不是又一个编排层。\n我们是挂在它们下面的一层——负责让它们所做的取舍，变成不可撤销的。",
 n:"可砍到只剩「30 行 + 一句话差别」，省 20 秒"},

{p:"P12",d:45,g:"把「开源失败」从姿态变成证据",
 t:"最后我想说这个项目最不一样的地方。\n\n我们开源了【252 条失败模式】，每一条都带可复现的代码。\n还有【68 份实验报告】，里面包含被我自己推翻的预注册判据——推翻记录原样保留，没有删。\n\n‖停 2 秒‖\n\n三十秒就能编出一个可信的成功故事。\n但【编不出 252 条带代码的失败记录。】\n\n这里有一条我必须自己揭：就在上一轮，我发现我此前两次口头说「视频片头条数已核对」——两次都是错的。\n这个错误本身，现在也在失败库里。",
 n:"追问：252 条怎么验？→ python3 tools/count_patterns.py，口径在文档里写明。"},

{p:"P13",d:25,g:"收束回开头那句话",
 t:"回到开头那句话。\n\n当一个系统【必须取舍、必须记住、而且真的会死】的时候——\n它会自己长出结构。不是我们设计的，是被逼出来的。\n\n‖停‖\n\n这就是洛神 O1。",
 n:""},

{p:"P14",d:10,g:"交棒问答",
 t:"谢谢。问答环节请看仓库，所有数字一条命令可复现。",
 n:"缓冲 60 秒 + 6 个高频问题，见 docs/路演问答卡.md"}
];

const TOTAL=480, SPEAK=420;
let i=0, t=0, running=false, timer=null, pageStart=0;

function fmt(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}

function render(){
  const s=S[i];
  document.getElementById("page").textContent=s.p+" / "+S.length;
  document.getElementById("total").textContent=fmt(TOTAL-t);
  document.getElementById("elapsed").textContent="已用 "+fmt(t);
  document.getElementById("timebar").style.width=Math.min(100,t/TOTAL*100)+"%";
  document.getElementById("goal").textContent="▍ "+s.g;
  let h=s.t.replace(/【([^】]+)】/g,'<span class="num">$1</span>')
           .replace(/‖([^‖]+)‖/g,'<span class="pause">‖$1‖</span>');
  document.getElementById("script").innerHTML=h;
  document.getElementById("script").scrollTop=0;
  document.getElementById("next").innerHTML=s.n?("下一页 "+S[Math.min(i+1,S.length-1)].p+" · <b>"+s.n.replace(/\n/g,"　")+"</b>"):"";
  pageStart=t;
  const pt=document.getElementById("pgtime");
  pt.textContent="本页 "+s.d+" 秒";
  pt.className="";
}

function tick(){
  if(!running)return;
  t+=1;
  const s=S[i];
  const used=t-pageStart;                 // 本页已用
  const left=s.d-used;                    // 本页剩余
  const sched=S.slice(0,i+1).reduce((a,x)=>a+x.d,0); // 脚本进度应到
  const drift=sched-t;                    // 正=领先脚本，负=落后
  const pt=document.getElementById("pgtime");
  let txt="本页 "+s.d+" 秒　已用 "+fmt(used);
  if(left<0){txt+="　【超时 "+(-left)+" 秒】";pt.className="warn";}
  else{txt+="　剩 "+left+" 秒";pt.className="";}
  txt+="　｜　全局"+(drift>=0?"领先 ":"落后 ")+Math.abs(drift)+" 秒";
  if(t>SPEAK){txt+="　｜　已进入问答缓冲";pt.className="warn";}
  pt.textContent=txt;
  document.getElementById("total").textContent=fmt(TOTAL-t);
  document.getElementById("elapsed").textContent="已用 "+fmt(t);
  document.getElementById("timebar").style.width=Math.min(100,t/TOTAL*100)+"%";
  if(t>=TOTAL){running=false;clearInterval(timer);document.getElementById("total").textContent="0:00";return;}
  timer=setTimeout(tick,1000);
}

function start(){
  document.getElementById("overlay").style.display="none";
  running=true;render();timer=setTimeout(tick,1000);
}
function next(){if(i<S.length-1){i++;render();}}
function prev(){if(i>0){i--;render();}}
function reset(){i=0;t=0;running=true;render();clearTimeout(timer);timer=setTimeout(tick,1000);}

document.addEventListener("keydown",e=>{
  if(!running){if(e.code==="Space"||e.code==="Enter"){e.preventDefault();start();}return;}
  if(e.code==="Space"||e.code==="ArrowRight"){e.preventDefault();next();}
  else if(e.code==="ArrowLeft"){e.preventDefault();prev();}
  else if(e.key==="r"||e.key==="R"){reset();}
});
document.addEventListener("click",e=>{if(!running)start();});
render();
</script>
</body>
</html>
