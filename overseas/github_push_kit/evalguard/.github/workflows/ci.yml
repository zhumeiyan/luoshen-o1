name: evalguard
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.9", "3.10", "3.11", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: self-test (zero dependency; pytest not required)
        run: python3 tests/run_tests.py
      - name: lint own source -- must stay clean
        run: |
          python3 -m evalguard rules.py cli.py --severity warn
      - name: fixture smoke
        run: |
          python3 -m evalguard tests/planted_eval.py || true
          python3 -m evalguard tests/clean_eval.py
