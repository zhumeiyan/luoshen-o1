name: Order Auto-Fulfill

# 客户在落地页点 "I've paid" -> 打开带 order label 的 issue
# Actions 自动校验订单号格式 -> 自动回复下载链接 -> 打标签 -> 关闭
# 不需要 SMTP：全程走 GitHub Issues API，repo 自带权限

on:
  issues:
    types: [opened, reopened]

permissions:
  issues: write
  contents: read

jobs:
  fulfill:
    if: contains(github.event.issue.labels.*.name, 'order')
    runs-on: ubuntu-latest
    steps:
      - name: Parse order
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const num  = context.payload.issue.number;

            // 抓取 tier
            let tier = 'unknown';
            const mTier = body.match(/tier\s*[:：]\s*(starter|pro|team|free)/i);
            if (mTier) tier = mTier[1].toLowerCase();

            // 抓取汇款参考号（>=6 位字母数字，允许 - 和空格）
            let ref = null;
            const mRef = body.match(/reference\s*[:：]\s*([A-Za-z0-9][A-Za-z0-9\- ]{5,})/i);
            if (mRef) ref = mRef[1].trim();

            // 抓取联系邮箱
            let mail = null;
            const mMail = body.match(/email\s*[:：]\s*(\S+@\S+)/i);
            if (mMail) mail = mMail[1];

            core.setOutput('tier', tier);
            core.setOutput('ref', ref || '');
            core.setOutput('mail', mail || '');
            core.setOutput('valid', String(!!(ref && tier !== 'unknown')));

            core.info(`order #${num} tier=${tier} ref=${ref} valid=${!!ref}`);

      - name: Reply with download link
        uses: actions/github-script@v7
        with:
          script: |
            const tier = '${{ steps.parse.outputs.tier }}';
            const ref  = '${{ steps.parse.outputs.ref }}';
            const valid = '${{ steps.parse.outputs.valid }}' === 'true';
            const num  = context.payload.issue.number;

            const RAW = 'https://raw.githubusercontent.com/zhumeiyan/evalguard/main';
            const LINKS = {
              starter: RAW + '/canon/canon_zh.json',
              pro:     RAW + '/dist/evalguard-v0.3.0.zip',
              team:    RAW + '/dist/evalguard-v0.3.0.zip',
              free:    RAW + '/canon/canon_zh.json'
            };

            if (!valid) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: num,
                body: [
                  '### ⚠️ Order incomplete — 订单信息不完整',
                  '',
                  'We could not parse a valid **tier** and **remittance reference**.',
                  '无法解析出有效的 **档位** 和 **汇款参考号**，请补充后重新打开此 issue。',
                  '',
                  'Required format / 必需格式：',
                  '```',
                  'tier: starter        # starter | pro | team',
                  'reference: ABC123456 # remit.alipay.com 给你的参考号，>=6 位',
                  'email: you@corp.com  # 可选，用于补发',
                  '```',
                  '',
                  '_This is an automated reply. 这是一条自动回复。_'
                ].join('\n')
              });
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: num,
                labels: ['order', 'needs-info']
              });
              return;
            }

            const link = LINKS[tier] || LINKS.starter;
            const price = { starter: '$29', pro: '$99', team: '$499', free: '$0' }[tier] || '$29';

            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: num,
              body: [
                '### ✅ Order received — 已收到订单',
                '',
                `- **Tier**: \`${tier}\` (${price})`,
                `- **Reference**: \`${ref}\``,
                '',
                '#### 📦 Download / 下载',
                `[evalguard-v0.3.0.zip](${link})`,
                '',
                '```bash',
                'unzip evalguard-v0.3.0.zip && cd evalguard-v0.3.0',
                'python3 -m evalguard your_eval.py       # 16 rules, free',
                'python3 -m evalguard your_eval.py --pro # 26 rules, PRO',
                '```',
                '',
                '#### 🔑 No license key needed / 无需授权码',
                'The package is MIT. Unzip and run — no activation step.',
                '',
                '#### 📖 What you got / 你买到了什么',
                '- 26 static rules sourced from a 368-entry failure-mode canon',
                '- Every finding cites the canon ID it came from',
                '- Zero dependency, MIT licensed, runs on Python 3.8+',
                '- Reported: 10/10 seeded defects caught, 0 false positives on conforming code',
                '',
                '#### ❓ Problem?',
                'Reply to this issue or email `778131400@qq.com`.',
                '',
                '_Automated by Order Auto-Fulfill. 本条由自动化工作流发出。_'
              ].join('\n')
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: num,
              labels: ['order', 'fulfilled']
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: num,
              state: 'closed'
            });

      - name: Daily digest marker
        uses: actions/github-script@v7
        with:
          script: |
            core.info('fulfill done for #' + context.payload.issue.number);
