[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evalguard"
version = "0.2.0"
description = "Static linter for LLM/agent evaluation scripts, backed by a 368-entry empirical failure-mode canon"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["llm", "evaluation", "linter", "static-analysis", "agent", "benchmark"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
]
dependencies = []

[project.scripts]
evalguard = "evalguard.cli:main"

[project.urls]
Homepage = "https://github.com/zhumeiyan/evalguard"
