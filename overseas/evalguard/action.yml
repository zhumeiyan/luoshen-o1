name: evalguard
description: >-
  Catch evaluation code that fails silently — a script that runs to
  completion, exits 0, prints a confident number, and is wrong.
author: zhumeiyan
branding:
  icon: shield
  color: purple

inputs:
  paths:
    description: Files or directories to scan
    required: false
    default: "."
  severity:
    description: Minimum severity to report — blocker, warn or info
    required: false
    default: warn
  pro:
    description: Enable the PRO rule pack (10 additional rules)
    required: false
    default: "false"
  fail-on:
    description: >-
      Fail the job at this severity or above. Use "none" to report without
      failing, which is the right setting while you triage an existing repo.
    required: false
    default: blocker
  sarif:
    description: >-
      Write a SARIF 2.1.0 file for upload to GitHub Code Scanning. Findings
      then appear inline on the pull request diff.
    required: false
    default: "true"
  sarif-file:
    description: Where to write the SARIF output
    required: false
    default: evalguard.sarif

outputs:
  blockers:
    description: Number of blocker-severity findings
    value: ${{ steps.scan.outputs.blockers }}
  warns:
    description: Number of warn-severity findings
    value: ${{ steps.scan.outputs.warns }}
  findings:
    description: Total findings at or above the requested severity
    value: ${{ steps.scan.outputs.findings }}
  sarif-file:
    description: Path to the SARIF file, if written
    value: ${{ steps.scan.outputs.sarif-file }}

runs:
  using: composite
  steps:
    # No pip install, no network: the action runs the vendored source with
    # whatever python3 the runner already has. A security scanner that
    # needs to download a package before it can tell you a script is
    # lying has the wrong dependency story.
    - name: Scan
      id: scan
      shell: bash
      env:
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_SEVERITY: ${{ inputs.severity }}
        INPUT_PRO: ${{ inputs.pro }}
        INPUT_FAILON: ${{ inputs.fail-on }}
        INPUT_SARIF: ${{ inputs.sarif }}
        INPUT_SARIF_FILE: ${{ inputs.sarif-file }}
        ACTION_DIR: ${{ github.action_path }}
      run: |
        set -euo pipefail
        PY="${PYTHON:-python3}"
        export PYTHONPATH="$ACTION_DIR"
        flags=()
        [ "$INPUT_PRO" = "true" ] && flags+=("--pro")
        if [ "$INPUT_SARIF" = "true" ]; then
          "$PY" -m evalguard $INPUT_PATHS \
            --format sarif --severity "$INPUT_SEVERITY" "${flags[@]}" \
            > "$INPUT_SARIF_FILE"
          echo "sarif-file=$INPUT_SARIF_FILE" >> "$GITHUB_OUTPUT"
        fi
        # Human-readable run for the job log. `--severity info` on purpose:
        # the log is where you learn, the gate is what fails the build.
        "$PY" -m evalguard $INPUT_PATHS \
          --format json --severity info "${flags[@]}" > _eg.json || true
        "$PY" - "$INPUT_PATHS" "$INPUT_SEVERITY" "$INPUT_FAILON" <<'PYEOF'
        import json, os, sys
        paths, sev, failon = sys.argv[1], sys.argv[2], sys.argv[3]
        order = {"blocker": 0, "warn": 1, "info": 2}
        try:
            data = json.load(open("_eg.json"))
        except Exception as e:
            print(f"::warning::could not read scan output: {e}")
            sys.exit(0)
        counts = {"blocker": 0, "warn": 0, "info": 0}
        for _f, rows in data.items():
            for r in rows or []:
                if r.get("eg_id") == "EG000":
                    continue          # gate bookkeeping, not a finding
                s = r.get("severity", "info")
                counts[s] = counts.get(s, 0) + 1
        total = sum(counts[s] for s in order if order[s] <= order[sev])
        print(f"::notice::evalguard — {counts['blocker']} blocker, "
              f"{counts['warn']} warn, {counts['info']} info")
        with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
            fh.write(f"blockers={counts['blocker']}\n")
            fh.write(f"warns={counts['warn']}\n")
            fh.write(f"findings={total}\n")
        if failon != "none" and counts.get(failon, 0):
            print(f"::error::evalguard found {counts[failon]} {failon}-severity "
                  "finding(s)")
            sys.exit(1)
        PYEOF
