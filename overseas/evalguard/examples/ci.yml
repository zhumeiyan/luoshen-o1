# Copy to .github/workflows/evalguard.yml in your own repository.
#
# What this buys you: findings appear INLINE on the pull request diff, next
# to the line that produced them. That is the difference between a check a
# developer reads and one they scroll past — a job log is somewhere else,
# the diff is where they already are.
#
# Requires: `security-events: write` for the SARIF upload. Everything else
# is stdlib python; there is nothing to install and nothing to cache.

name: evalguard

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write      # needed only for the SARIF upload below

jobs:
  evalguard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Point this at your own copy, or at the upstream repo:
      #   uses: zhumeiyan/luoshen-o1/overseas/evalguard@main
      - name: Scan evaluation code
        id: eg
        uses: ./
        with:
          paths: "evals tests"     # where your evaluation scripts live
          severity: warn
          fail-on: blocker         # "none" while triaging an existing repo

      - name: Upload to Code Scanning
        if: always() && steps.eg.outputs.sarif-file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.eg.outputs.sarif-file }}
          category: evalguard

      - name: Summary
        if: always()
        run: |
          echo "### evalguard" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- blockers: ${{ steps.eg.outputs.blockers || 0 }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- warnings: ${{ steps.eg.outputs.warns || 0 }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "A blocker means the number your script prints can be wrong "
               "while the script still exits 0." >> "$GITHUB_STEP_SUMMARY"
