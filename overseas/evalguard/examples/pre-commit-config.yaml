# Copy into .pre-commit-config.yaml
#
# Why bother when CI already runs it: CI tells you after the push, and the
# finding is then two contexts away from the line that caused it. The
# pre-commit hook fails at the moment you write `except Exception: pass`,
# while you still remember why you wrote it.
#
# `language: system` is deliberate. This project's whole argument is that a
# scanner should not need to install anything before it can tell you your
# script is lying; making the hook build an isolated venv on first commit
# would undercut that for no benefit, since evalguard has no dependencies.

repos:
  - repo: https://github.com/zhumeiyan/luoshen-o1
    rev: main
    hooks:
      - id: evalguard
        name: evalguard
        entry: python3 -m evalguard
        language: system
        types: [python]
        # Only the paths where evaluation code actually lives. Running this
        # over a whole application codebase produces noise: rules about
        # baselines and held-out sets are meaningless outside eval scripts.
        files: ^(evals|tests|benchmarks|experiments)/
        args: ["--severity", "warn"]
        pass_filenames: true
